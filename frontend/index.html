<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Monitoring Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>AI-Powered Solar Tracking Dashboard</h1>

        <div class="card">
            <h2>LDR Left</h2>
            <p id="ldrLeft">0</p>
        </div>

        <div class="card">
            <h2>LDR Right</h2>
            <p id="ldrRight">0</p>
        </div>

        <div class="card">
            <h2>Servo Angle</h2>
            <p id="angle">0</p>
        </div>

        <div class="card">
            <h2>Voltage</h2>
            <p id="voltage">0</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
